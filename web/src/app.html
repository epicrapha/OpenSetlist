<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- ponytail: external fonts for now; self-host in the offline/PWA pass (M3). -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!-- PWA head tags live here, not in +layout.svelte: with `ssr = false` the
		     layout's <svelte:head> is injected at runtime, so the static fallback
		     index.html would carry no manifest/theme tags until JS boots. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#11141a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="OpenSetlist" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
