[package]
name = "opensetlist-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "opensetlist_server"
path = "src/lib.rs"

[[bin]]
name = "opensetlist-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tower-sessions = { version = "0.14", features = ["signed"] }
# Enables Key::derive_from for the session cookie key (tower-cookies does not).
cookie = { version = "0.18", features = ["key-expansion"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
