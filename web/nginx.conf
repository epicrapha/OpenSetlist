server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# SPA: serve the fallback for any route not on disk.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Server health, with a Set-Cookie-free pass-through for smoke checks.
	location = /health {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Same-origin API: forward to the Rust server (docker-compose service name).
	location /api/ {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The service worker must not be cached.
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}
}
