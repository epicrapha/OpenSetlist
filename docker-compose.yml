services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensetlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-opensetlist}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensetlist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opensetlist}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-opensetlist}
      BIND_ADDR: 0.0.0.0:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-me-32-bytes-minimum-dev-only}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
